---
layout: default
---
<div class="container page">
  {%- unless page.hide_title or page.title == nil -%}
  <header class="page-header">
    {%- if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1 class="page-title">{{ page.title }}</h1>
    {%- if page.lede %}<p class="page-lede">{{ page.lede }}</p>{% endif %}
  </header>
  {%- endunless -%}
  <div class="page-body{% if page.prose %} prose{% endif %}">
    {{ content }}
  </div>
</div>
